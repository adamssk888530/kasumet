<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — KASUMET</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="header">

        <div class="logo">
            KASUMET
            <span>VIRTUAL MARKET</span>
        </div>

    </header>


    <main class="register-page">

        <section class="register-card">

            <div class="register-header">

                <div class="register-icon">
                    🔐
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your KASUMET account.
                </p>

            </div>


            <form id="buyerLoginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="register-message"
                ></p>

            </form>


            <div class="login-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register — KASUMET</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="header">

        <div class="logo">
            KASUMET
            <span>VIRTUAL MARKET</span>
        </div>

    </header>


    <main class="register-page">

        <section class="register-card">

            <div class="register-header">

                <div class="register-icon">
                    👤
                </div>

                <h1>
                    Create Buyer Account
                </h1>

                <p>
                    Join KASUMET and explore the virtual market.
                </p>

            </div>


            <form id="buyerRegisterForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="08012345678"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="agreeTerms"
                            required
                        >

                        I agree to the
                        <a href="#">
                            KASUMET Terms
                        </a>
                        and
                        <a href="#">
                            Privacy Policy
                        </a>.

                    </label>

                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="register-message"
                ></p>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="#">
                    Login
                </a>

            </div>

        </section>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
